<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECS スタッフ画面（スマホ表示プレビュー）</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* スマホ表示の見え方を確認するためのプレビュー用ページ。
       中身は staff_portal.html を“スマホ幅の枠”にはめて表示しているだけです。 */
    body {
      background: #3a2d20; min-height: 100vh; margin: 0;
      display: flex; flex-direction: column; align-items: center;
      padding: 22px 12px 34px;
    }
    .note {
      color: #e3d6c0; font-size: 13px; text-align: center;
      max-width: 460px; margin-bottom: 18px; line-height: 1.7;
    }
    .note a { color: #f0c9a8; }

    /* スマホの端末枠 */
    .phone {
      width: 390px; max-width: 96vw; height: 800px; max-height: 86vh;
      background: #fff; border-radius: 40px; padding: 12px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      border: 1px solid #1f160d;
    }
    .phone-screen {
      width: 100%; height: 100%; border-radius: 28px; overflow: hidden;
      background: #fff; position: relative;
    }
    /* 中に実物を表示（iframe） */
    .phone-screen iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* ノッチ風の飾り */
    .notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 130px; height: 22px; background: #1f160d;
      border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; z-index: 5;
    }
  </style>
</head>
<body>
  <div class="note">
    📱 これは <b>staff_portal.html</b> をスマホ幅（390px）の枠にはめたプレビューです。<br>
    中身は実物そのものなので、タブの切り替え・エントリーボタン・💬コメントの開閉もそのまま動きます。<br>
    ＰＣ表示で見たいときは <a href="staff_portal.html">staff_portal.html を直接ひらく</a> →ウィンドウを広げてください。
  </div>

  <div class="phone">
    <div class="phone-screen">
      <div class="notch"></div>
      <iframe src="staff_portal.html" title="スタッフ画面スマホ表示"></iframe>
    </div>
  </div>
</body>
</html>
